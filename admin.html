<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>DRIVEKIT — керування магазином</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./admin.css">
</head>
<body class="admin-body">
  <header class="admin-header">
    <a class="brand" href="./index.html"><span class="brand-mark">D</span><span>DRIVEKIT ADMIN</span></a>
    <div><a class="admin-site-link" href="./index.html" target="_blank" rel="noopener">Відкрити магазин ↗</a><button class="admin-logout" id="logout" type="button">Вийти</button></div>
  </header>

  <main class="admin-main">
    <section class="admin-title">
      <div><div class="eyebrow">Каталог</div><h1>Керування магазином</h1></div>
      <button class="btn" id="newProduct" type="button">+ Додати товар</button>
    </section>

    <nav class="admin-tabs" aria-label="Розділи адмінки">
      <button class="active" data-admin-tab="products" type="button">Товари</button>
      <button data-admin-tab="categories" type="button">Категорії</button>
    </nav>

    <section id="productsPanel">
      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead><tr><th>Товар</th><th>Категорія</th><th>Ціна</th><th>Залишок</th><th>Статус</th><th></th></tr></thead>
          <tbody id="productsTable"><tr><td colspan="6">Завантаження…</td></tr></tbody>
        </table>
      </div>
    </section>

    <section id="categoriesPanel" hidden>
      <form class="category-form" id="categoryForm">
        <input type="hidden" name="id">
        <label><span>Назва категорії</span><input name="name" required placeholder="Наприклад, Компресори"></label>
        <label><span>Порядок</span><input name="sort_order" type="number" value="100"></label>
        <button class="btn" type="submit">Зберегти</button>
        <button class="btn btn-ghost" id="cancelCategory" type="button" hidden>Скасувати</button>
      </form>
      <div class="category-admin-list" id="categoryList"></div>
    </section>

    <div class="admin-status" id="adminStatus" role="status"></div>
  </main>

  <dialog class="product-editor" id="productEditor">
    <form class="product-form" id="productForm">
      <button type="button" class="close-modal" id="closeProductEditor" aria-label="Закрити">×</button>
      <div class="eyebrow">Товар</div>
      <h2 id="productFormTitle">Новий товар</h2>
      <input type="hidden" name="id">
      <div class="product-form-grid">
        <label class="wide"><span>Назва</span><input name="name" required maxlength="140"></label>
        <label><span>Ціна, ₴</span><input name="price" type="number" min="0" step="1" required></label>
        <label><span>Стара ціна, ₴</span><input name="compare_price" type="number" min="0" step="1"></label>
        <label><span>Категорія</span><select name="category_id" id="productCategory"><option value="">Без категорії</option></select></label>
        <label><span>Залишок</span><input name="stock" type="number" min="0" step="1" value="0"></label>
        <label><span>Порядок</span><input name="sort_order" type="number" step="1" value="100"></label>
        <label class="check-label"><input name="active" type="checkbox" checked><span>Показувати в магазині</span></label>
        <label class="wide"><span>Опис</span><textarea name="description" rows="4" maxlength="2000"></textarea></label>
        <label class="wide"><span>URL фото</span><input name="image_url" type="url" placeholder="https://…"></label>
        <label class="wide"><span>Або завантажити фото (JPG/PNG/WEBP до 3 МБ)</span><input name="image_file" type="file" accept="image/jpeg,image/png,image/webp"></label>
      </div>
      <div class="product-form-actions"><button class="btn" type="submit">Зберегти товар</button><button class="btn btn-ghost" type="button" id="cancelProduct">Скасувати</button></div>
      <div class="form-status" id="productStatus" role="status"></div>
    </form>
  </dialog>
  <script src="./admin.js"></script>
</body>
</html>
